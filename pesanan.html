<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pesanan — CVKita</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="page-head"><a href="index.html">←</a><h1>Pesanan</h1><span></span></header>
<main class="section" id="orders"></main>
<nav class="bottom"><a href="index.html">🏠<span>Beranda</span></a><a class="active" href="pesanan.html">🧾<span>Pesanan</span></a><a href="kontak.html">💬<span>Kontak</span></a></nav>
<script src="app.js"></script><script>
const o=JSON.parse(localStorage.getItem('cv_order')||'null'); const box=document.getElementById('orders');
if(!o) box.innerHTML='<div class="empty"><div>🧾</div><h2>Belum ada pesanan</h2><p>Pesanan CV kamu akan muncul di sini.</p><a class="btn primary" href="index.html#paket">Pilih Paket</a></div>';
else {const p=packages.find(x=>x.id===o.package)||packages[0];box.innerHTML=`<div class="order-card"><span class="status">Menunggu konfirmasi</span><h2>${p.icon} ${p.name}</h2><p>${o.name}</p><div class="price">${money(p.price)}</div><button class="btn wa full" onclick="sendWhatsApp(o,p)">Kirim ulang ke WhatsApp</button></div>`}
</script></body></html>
